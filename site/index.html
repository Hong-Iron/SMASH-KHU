<head>

<title>SMASH KHU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage with a realistic sky; a left column holds the title and the tool dock; on phones the dock moves to the bottom edge */
:root {
  --bg: #e6eaef;
  --surface: #fbfcfd;
  --hover: #eef2f6;
  --fg: #16202c;
  --muted: #5a6676;
  --line: #d3dae3;
  --shadow: rgba(22, 32, 44, .14);
  --accent: #c2410c;
  --accent-soft: #fde9dc;
  --on-accent: #ffffff;
  --ring: #ff6a2b;

  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #18202a; --hover: #222c38; --fg: #e5eaf1; --muted: #97a3b3; --line: #2b3542;
    --shadow: rgba(0, 0, 0, .45); --accent: #fb8c4b; --accent-soft: #3a2518; --on-accent: #1a0d05; --ring: #ff8a4f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #18202a; --hover: #222c38; --fg: #e5eaf1; --muted: #97a3b3; --line: #2b3542;
  --shadow: rgba(0, 0, 0, .45); --accent: #fb8c4b; --accent-soft: #3a2518; --on-accent: #1a0d05; --ring: #ff8a4f;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; overscroll-behavior: none; }
@supports (height: 100dvh) { html, body { height: 100dvh !important; } }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app.night { background: #070b14; }
#app { position: relative; height: 100%; overflow: hidden; background: #b9cde3; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.label {
  position: absolute; left: 0; top: 0; padding: 2px 7px; border-radius: 4px;
  background: rgba(14, 19, 25, .72); color: #f4f6f8; font: 500 12px/1.35 var(--font-ui); white-space: nowrap;
  opacity: 0; visibility: hidden; transition: opacity .15s, visibility .15s;
}
.label::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 7px; background: rgba(14, 19, 25, .6); }
.label.on { opacity: 1; visibility: visible; }
#tip {
  position: absolute; left: 0; top: 0; pointer-events: none; padding: 3px 8px; border-radius: 4px;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 2px 8px var(--shadow);
  font: 500 13px/1.35 var(--font-ui); white-space: nowrap;
}

.side { position: absolute; top: 16px; left: 16px; width: 292px; display: flex; flex-direction: column; gap: 10px; }
.titlebar, .dock { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px var(--shadow); }
.titlebar { padding: 12px 16px 11px; }
.eyebrow { margin: 0; font: 500 11px/1.4 var(--font-data); letter-spacing: .03em; color: var(--muted); }
h1 { margin: 0; font: 400 22px/1.2 "Bungee", Impact, "Arial Black", sans-serif; letter-spacing: .01em; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

.dock { padding: 12px; display: grid; gap: 10px; }
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tool[data-tool="nuke"][aria-checked="true"] { background: #2b2410; border-color: #e8c21a; color: #fff6cf; }
.tool[data-tool="nuke"][aria-checked="true"] svg { color: #ffd23f; }
.tool[data-tool="nuke"][aria-checked="true"] .td, .tool[data-tool="nuke"][aria-checked="true"] kbd { color: #e9dca6; }
.tool {
  display: grid; justify-items: center; gap: 2px; padding: 9px 4px 8px; min-width: 0;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; text-align: center;
}
.tool:hover { background: var(--hover); }
.tool svg { width: 26px; height: 26px; }
.tool .tn { font-weight: 600; font-size: 13.5px; }
.tool .td { font-size: 11px; color: var(--muted); line-height: 1.3; }
.tool[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.tool[aria-checked="true"] svg { color: var(--accent); }
kbd { font: 500 10.5px var(--font-data); color: var(--muted); }

.acts { display: grid; grid-template-columns: 1.25fr 1fr 0.8fr; gap: 6px; }
.toolopt { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 10px; padding: 7px 10px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.toolopt label { font-weight: 600; font-size: 12.5px; }
.toolopt output { justify-self: end; font: 500 12px var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.toolopt input { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
#more { display: none; }
.credit .short { display: none; }
#hint { display: none; }
#rewind-fx { position: absolute; inset: 0; z-index: 57; pointer-events: none; opacity: 0; transition: opacity .15s;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px), linear-gradient(rgba(60,110,255,.14), rgba(60,110,255,.14)); }
#rewind-fx span { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); font: 400 28px "Bungee", Impact, sans-serif; color: #fff; letter-spacing: .04em; text-shadow: 0 0 14px rgba(80,140,255,.95), 0 2px 0 rgba(0,0,0,.5); }
#app.rewinding #rewind-fx { opacity: 1; }
#app.rewinding #rewind-fx span { animation: rwBlink .5s steps(2) infinite; }
@keyframes rwBlink { 50% { opacity: .35; } }
#share-modal { position: absolute; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(5, 7, 12, .72); }
#share-modal .sheet { display: grid; gap: 12px; width: min(420px, 100%); max-height: 100%; overflow: auto; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
#share-modal h2 { margin: 0; font-size: 15px; font-weight: 600; }
#share-modal img { display: block; width: 100%; height: auto; border-radius: 8px; background: #0b0d12; }
#share-modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#share-modal .row .act { text-decoration: none; color: inherit; }
#share-modal .row svg { width: 18px; height: 18px; flex: none; }
#share-modal .row .act { align-items: center; gap: 6px; }
#share-kakao { background: #fee500 !important; border-color: #e0c800 !important; color: #191919 !important; font-weight: 600; }
#share-insta { background: linear-gradient(45deg, #f9ce34, #ee2a7b 45%, #6228d7) !important; border-color: transparent !important; color: #fff !important; font-weight: 600; }
#share-modal .note { margin: 0; font-size: 12px; color: var(--muted); }
#toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); z-index: 80; max-width: calc(100% - 40px); margin: 0; padding: 8px 14px; border-radius: 10px; background: rgba(12, 14, 18, .82); color: #fff; font: 600 13px/1.5 var(--font-ui); text-align: center; pointer-events: none; transition: opacity .5s; }
#toast.fade { opacity: 0; }
.act { display: flex; justify-content: center; align-items: baseline; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; font-weight: 500; }
.act:hover:not(:disabled) { background: var(--hover); }
.act:disabled { opacity: .45; cursor: default; }
#undo:not(:disabled) { background: var(--fg); border-color: var(--fg); color: var(--surface); }
#undo:not(:disabled) kbd { color: inherit; opacity: .7; }

.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 12.5px; }
.opt:hover { background: var(--hover); }
.opt[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.support-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.opt.support { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; text-decoration: none; background: #ffdd00; border-color: #e3c300; color: #1f1700; font-weight: 600; }
.opt.support:hover { background: #ffe640; }
.opt.support.kakao { background: #fee500; border-color: #e0c800; color: #191919; }
.opt.support.kakao:hover { background: #fff04d; }
.count { margin: 0; color: var(--muted); font: 12px var(--font-data); font-variant-numeric: tabular-nums; }

.compass {
  position: absolute; right: 16px; bottom: 40px; width: 46px; height: 46px; padding: 0;
  display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%;
  background: var(--surface); box-shadow: 0 2px 8px var(--shadow); cursor: pointer;
}
.compass svg { width: 30px; height: 30px; }
.credit {
  position: absolute; left: 16px; bottom: 10px; max-width: calc(100% - 92px); margin: 0; padding: 3px 8px;
  border-radius: 4px; background: color-mix(in srgb, var(--surface) 85%, transparent);
  color: var(--muted); font-size: 11px; line-height: 1.4; pointer-events: none;
}
.credit a { color: inherit; pointer-events: auto; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--muted); text-align: center; }
.overlay p { max-width: 36ch; margin: 0; }

/* style rank HUD: a game overlay with its own fixed colours, readable over the bright sky */
.hud { position: absolute; top: 16px; right: 16px; width: 260px; display: grid; justify-items: end; gap: 4px; pointer-events: none; text-align: right; }
.rank { display: grid; justify-items: end; gap: 3px; opacity: 0; transform: translateX(18px); transition: opacity .25s, transform .25s; }
.rank.on { opacity: 1; transform: none; }
.rk {
  display: inline-block; font: 400 78px/0.9 "Bungee", Impact, "Arial Black", sans-serif; letter-spacing: -.03em;
  color: var(--rc, #c9d1da); -webkit-text-stroke: 2px rgba(12, 14, 18, .9);
  text-shadow: 0 0 22px var(--rc, #c9d1da), 0 5px 0 rgba(12, 14, 18, .55); transform: skewX(-10deg);
}
.rk.up { animation: rankUp .5s cubic-bezier(.2, 1.7, .4, 1); }
.rk.hit { animation: rankHit .2s ease-out; }
@keyframes rankUp { from { transform: skewX(-10deg) scale(1.9); } to { transform: skewX(-10deg) scale(1); } }
@keyframes rankHit { 50% { transform: skewX(-10deg) scale(1.12) translateX(-5px); } }
.rw { font: 400 15px/1.1 "Bungee", Impact, "Arial Black", sans-serif; color: #fff; -webkit-text-stroke: .7px rgba(12, 14, 18, .95); text-shadow: 0 2px 6px rgba(0, 0, 0, .55); transform: skewX(-10deg); max-width: 260px; }
.gauge { display: block; width: 180px; height: 6px; border-radius: 3px; background: rgba(12, 14, 18, .5); overflow: hidden; }
.gauge i { display: block; height: 100%; width: 0; background: var(--rc, #c9d1da); box-shadow: 0 0 10px var(--rc, #c9d1da); }
.rko { font: 600 12px/1.3 var(--font-ui); color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .75); }
.score { margin: 4px 0 0; display: flex; align-items: baseline; gap: 8px; padding: 3px 10px 4px; border-radius: 7px; background: rgba(12, 14, 18, .58); font: 400 12px "Bungee", Impact, sans-serif; color: rgba(255, 255, 255, .9); text-shadow: 0 2px 4px rgba(0, 0, 0, .6); }
.score b { font: 400 24px "Bungee", Impact, sans-serif; color: #fff; -webkit-text-stroke: .8px rgba(12, 14, 18, .9); font-variant-numeric: tabular-nums; }
#pops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 2px; animation: popUp 1.4s ease-out forwards; }
.pop b { font: 400 28px/1 "Bungee", Impact, sans-serif; color: var(--rc, #fff); -webkit-text-stroke: 1.2px rgba(12, 14, 18, .9); text-shadow: 0 3px 0 rgba(12, 14, 18, .5); }
.pop span { padding: 1px 7px; border-radius: 3px; background: rgba(12, 14, 18, .72); color: #fff; font: 600 12.5px/1.45 var(--font-ui); white-space: nowrap; }
@keyframes popUp {
  0% { opacity: 0; transform: translate(var(--x), var(--y)) translate(-50%, -50%) scale(.5); }
  12% { opacity: 1; transform: translate(var(--x), var(--y)) translate(-50%, -70%) scale(1.15); }
  100% { opacity: 0; transform: translate(var(--x), var(--y)) translate(-50%, -260%) scale(1); }
}
.banner { position: absolute; left: 50%; top: 28%; width: max-content; max-width: calc(100% - 32px); text-align: center; pointer-events: none; animation: banner 4.4s ease forwards; }
.banner b { display: block; font: 400 clamp(26px, 5.5vw, 54px)/1.05 "Bungee", Impact, sans-serif; color: #ffe27a; -webkit-text-stroke: 2px #2a1206; text-shadow: 0 0 34px rgba(255, 140, 40, .85); }
.banner span { display: inline-block; margin-top: 10px; padding: 5px 11px; border-radius: 5px; background: rgba(12, 14, 18, .74); color: #fff; font: 600 14.5px/1.45 var(--font-ui); max-width: 40ch; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } 8% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }

.depth {
  position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); width: min(320px, calc(100% - 340px)); min-width: 240px;
  display: grid; gap: 5px; padding: 9px 12px 10px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 24px var(--shadow);
}
.depth:hover { background: var(--hover); }
.depth .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.depth .lbl { font-size: 12px; color: var(--muted); }
.depth .lay { font-weight: 600; font-size: 13px; }
.depth .val { font: 500 17px var(--font-data); font-variant-numeric: tabular-nums; }

@media (max-width: 720px) {
  .side { display: contents; }
  .titlebar { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; right: auto; padding: 6px 12px 7px; border-radius: 8px; }
  h1 { font-size: 16px; }
  .hud { top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; width: 140px; gap: 1px; }
  .rk { font-size: 40px; -webkit-text-stroke-width: 1.5px; }
  .rw { font-size: 10px; max-width: 140px; }
  .gauge { width: 96px; height: 4px; }
  .rko { font-size: 10.5px; }
  .score { padding: 2px 8px 3px; }
  .score b { font-size: 16px; }
  .compass { display: none; }
  .depth { left: 10px; right: auto; top: calc(52px + env(safe-area-inset-top, 0px)); bottom: auto; transform: none; width: auto; max-width: calc(100% - 170px); min-width: 0; padding: 5px 9px 6px; gap: 1px; }
  .depth .lbl { display: none; }
  .depth .val { font-size: 13px; }
  .depth .lay { font-size: 11.5px; }
  .banner { top: 30%; }
  .banner span { font-size: 13px; }
  .dock { position: absolute; left: 10px; right: 10px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding: 7px; gap: 6px; border-radius: 12px; }
  .tools { gap: 4px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .tool { padding: 6px 2px 5px; gap: 1px; border-radius: 8px; }
  .tool .tn { font-size: 11px; white-space: nowrap; }
  .tool .td, .tool kbd, .act kbd { display: none; }
  .tool svg { width: 20px; height: 20px; }
  .acts { grid-template-columns: 1.2fr 1fr auto auto; gap: 5px; }
  #share { padding: 7px 10px; }
  .toolopt { padding: 5px 9px 6px; }
  .support-row { gap: 5px; }
  .support-row .opt { padding: 4px 6px; font-size: 12px; }
  .toolopt input { margin-top: 2px; }
  .act { padding: 7px 8px; font-size: 13px; }
  #more { display: flex; min-width: 44px; font-weight: 700; letter-spacing: .08em; }
  #more[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .opts { display: none; }
  .dock.open .opts { display: flex; }
  .opt { padding: 5px 9px; font-size: 12px; }
  .credit { left: 10px; right: 10px; max-width: none; bottom: calc(3px + env(safe-area-inset-bottom, 0px)); padding: 0; background: none; font-size: 9.5px; text-shadow: 0 1px 2px rgba(255,255,255,.7); }
  .credit .long { display: none; }
  .credit .short { display: inline; }
  .label { font-size: 11px; padding: 1px 6px; }
  #hint { display: block; position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 45; max-width: calc(100% - 40px); padding: 9px 14px; border-radius: 10px; background: rgba(12, 14, 18, .8); color: #fff; font: 600 13px/1.6 var(--font-ui); text-align: center; pointer-events: none; transition: opacity .6s; }
  #hint[hidden] { display: none; }
  #hint.fade { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .label { transition: none; }
  .rk.up, .rk.hit { animation: none; }
  .pop { animation: fadeOnly 1.4s forwards; transform: translate(var(--x), var(--y)) translate(-50%, -100%); }
  .banner { animation: fadeBanner 4.4s forwards; transform: translate(-50%, -50%); }
}
@keyframes fadeOnly { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fadeBanner { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage" aria-label="중앙대 서울캠퍼스 3D 지도"></div>
  <div id="labels"></div>
  <div id="tip" hidden></div>

  <div class="side">
    <header class="titlebar"><h1>SMASH KHU</h1></header>

    <div class="dock">
      <div class="tools" role="radiogroup" aria-label="부수는 도구">
        <button class="tool" type="button" role="radio" aria-checked="true" data-tool="bomb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="10" cy="14.5" r="6.5" fill="currentColor" stroke="none"></circle>
            <path d="M14.2 9.6l1.9-1.9"></path>
            <path d="M16.6 6.9c.9-1.9 2.4-2.8 4.1-2.6"></path>
            <path d="M20.7 1.6v1.3M22.4 3.6h-1.3M22 2l-.9.9"></path>
          </svg>
          <span class="tn">폭탄</span><span class="td">넓게 날림</span><kbd>1</kbd>
        </button>
        <button class="tool" type="button" role="radio" aria-checked="false" data-tool="bat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
            <path d="M4.5 19.5L10 14" stroke-width="2"></path>
            <path d="M10 14L19.2 4.8" stroke-width="4.2"></path>
            <circle cx="4" cy="20" r="1.4" fill="currentColor" stroke="none"></circle>
            <circle cx="18.2" cy="16.6" r="2.6" stroke-width="1.6"></circle>
          </svg>
          <span class="tn">배트</span><span class="td">멀리 날림</span><kbd>2</kbd>
        </button>
        <button class="tool" type="button" role="radio" aria-checked="false" data-tool="laser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8.5" y="2" width="7" height="4" rx="1" fill="currentColor" stroke="none"></rect>

    const file = new File([blob], `smash-${(CFG.code || 'campus').toLowerCase()}.png`, { type: 'image/png' });

            objectType: 'feed',
            content: { title: `${CFG.title} — ${headline}`, description: `점수 ${Math.round(score).toLocaleString('ko-KR')} · 무너진 건물 ${st.down}/${st.total}동`, imageUrl: img, imageWidth: 1080, imageHeight: 1350,
              link: { mobileWebUrl: CFG.url, webUrl: CFG.url } },

      toast(copied ? '링크를 복사하고 카드 이미지를 저장했습니다. 카카오톡에 붙여넣고 이미지를 함께 보내세요.' : '카드 이미지를 저장했습니다. 카카오톡에 이미지와 주소를 함께 보내세요.');
    };
    $('share-insta').onclick = async () => {
      if (sheet) { toast('공유 목록에서 Instagram을 고르세요. 스토리나 게시물로 올릴 수 있습니다.'); await shareFile(false); return; }
      downloadBlob(shareURL, file.name);
      toast(IS_MOBILE ? '카드 이미지를 저장했습니다. 인스타그램 앱에서 스토리나 게시물로 올려 주세요.' : '카드 이미지를 저장했습니다. 인스타그램(앱이나 instagram.com)에서 올려 주세요.');
    };
    $('share-go').onclick = () => shareFile(true);
    $('share-copy').onclick = async () => {
      toast((await copyText(text)) ? '문구와 링크를 복사했습니다.' : '복사하지 못했습니다. 주소창의 링크를 직접 복사해 주세요.');

}
const closeShare = () => { $('share-modal').hidden = true; };
$('share').addEventListener('click', openShare);
$('share-close').addEventListener('click', closeShare);
$('share-modal').addEventListener('click', (e) => { if (e.target.id === 'share-modal') closeShare(); });
if (CFG.hub) { const h = $('t-hub'); h.href = CFG.hub; h.hidden = false; }
$('t-night').addEventListener('click', () => { setNight(!night); store('smash-night', night ? 1 : 0); });
setNight(recall('smash-night') === '1');

$('undo').addEventListener('click', undo);
$('more').addEventListener('click', (e) => {
  const open = document.querySelector('.dock').classList.toggle('open');
  appEl.classList.toggle('opts-open', open);
  e.currentTarget.setAttribute('aria-expanded', String(open));
  obstaclesAt = -99;
});
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
if (COARSE) {
  let seen = false;
  try { seen = localStorage.getItem('smash-hint') === '1'; } catch (e) { /* storage blocked */ }
  if (!seen) {
    const hint = $('hint'); hint.hidden = false;
    const hide = () => { hint.classList.add('fade'); setTimeout(() => { hint.hidden = true; }, 700); try { localStorage.setItem('smash-hint', '1'); } catch (e) { /* storage blocked */ } };
    setTimeout(hide, 4500);
    renderer.domElement.addEventListener('pointerdown', hide, { once: true });
  }
}
$('reset').addEventListener('click', resetAll);
$('t-home').addEventListener('click', () => homeView());
$('t-top').addEventListener('click', topView);
$('compass').addEventListener('click', northUp);
$('t-labels').addEventListener('click', (e) => { showAll = !showAll; e.currentTarget.setAttribute('aria-pressed', String(showAll)); });
$('t-sound').addEventListener('click', (e) => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn)); });
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
$('undo-key').textContent = isMac ? '⌘Z' : 'Ctrl Z';
addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && !$('share-modal').hidden) { closeShare(); return; }
  if (e.key === 'Escape' && cine) { endCine(); return; }
  if (e.key === 'n' || e.key === 'N') { setNight(!night); store('smash-night', night ? 1 : 0); return; }
  const keys = { 1: 'bomb', 2: 'bat', 3: 'laser', 4: 'meteor', 5: 'quake', 6: 'nuke' };
  if (keys[e.key]) setTool(keys[e.key]);
});
function syncReticleColor() { reticle.material.color.set(getComputedStyle(root).getPropertyValue('--ring').trim() || '#ff6a2b'); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncReticleColor);
new MutationObserver(syncReticleColor).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
syncReticleColor();

// ============ loop
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.fov = camera.aspect < 1 ? 52 : 38;
  camera.updateProjectionMatrix();
  labelKey = ''; obstaclesAt = -99;
}
new ResizeObserver(resize).observe(stage);
const needle = $('needle');
let last = performance.now(), frames = 0;
const shakeOff = new THREE.Vector3();
let frozen = false;
function simulate(rdt, now) {
  if (frozen) return;
  if (rewind) { updateRewind(rdt); return; }
  if (cine) updateCine(rdt);
  const dt = rdt * timeScale * (hitStop > 0 ? 0.08 : 1);
  if (hitStop > 0) hitStop -= rdt;
  step(dt / 2); step(dt / 2);
  updateBombs(dt);
  if (laserBeam) updateLaser(dt);
  if (quake) updateQuake(dt);
  updateSwings(dt);
  updateSystem(dust, dt); updateSystem(smoke, dt); updateSystem(sparks, dt);
  updateFx(dt);
  if (expoBoost > 0) { expoBoost = Math.max(0, expoBoost - rdt * 1.3); }
  if (expoDip > 0 && !(laserBeam && laserBeam.phase === 'charge')) expoDip = Math.max(0, expoDip - rdt * 2);
  renderer.toneMappingExposure = expoBase * (1 + expoBoost) * (1 - expoDip);
  if (fogHeat > 0) { fogHeat = Math.max(0, fogHeat - rdt / 10); scene.fog.color.copy(fogBase).lerp(fogHot, fogHeat * 0.7); }

}
let perfT = 0, perfN = 0, raiseAfter = 0;
function adaptQuality(realDt, now) {
  perfT += realDt; perfN++;

  const fps = perfN / perfT; perfT = 0; perfN = 0;
  if (fps < 45 && pixelRatio > PR_MIN) { pixelRatio = Math.max(PR_MIN, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); raiseAfter = now + 10000; }
  else if (fps > 58 && pixelRatio < PR_MAX && now > raiseAfter) { pixelRatio = Math.min(PR_MAX, pixelRatio + 0.25); renderer.setPixelRatio(pixelRatio); resize(); raiseAfter = now + 10000; }
}
function frame(now) {
  const realDt = Math.min(0.5, (now - last) / 1000);

    const t = Math.min(1, (now - anim.t0) / anim.ms);

    controls.target.lerpVectors(anim.fT, anim.tT, e);
    camera.position.lerpVectors(anim.fP, anim.tP, e);
    if (t === 1) anim = null;
  }
  if (!cine) controls.update();
  simulate(rdt, now);
  tickStyle(rdt, now);
  tUni.uTime.value = now / 1000;
  if (glowBase > 0) glowLight.intensity = glowBase * (0.85 + 0.15 * Math.sin(now * 0.006) * Math.sin(now * 0.0023 + 1));
  if (hoverEv) { hover(hoverEv); hoverEv = null; }
  if (trauma > 0.001) {
    const s2 = trauma * trauma, tt = now / 1000;
    const ref = cine ? lookTmp : controls.target;
    const amp = (reduceMotion ? 0.25 : 1) * s2 * Math.max(0.6, camera.position.distanceTo(ref) * 0.02);
    shakeOff.set(wobble(tt * 24), wobble(tt * 24 + 31), wobble(tt * 24 + 67)).multiplyScalar(amp);
    camera.position.add(shakeOff);
    camera.rotateZ(wobble(tt * 19 + 5) * 0.025 * s2 * (reduceMotion ? 0.25 : 1));
    renderer.render(scene, camera);
    camera.position.sub(shakeOff);
    trauma = Math.max(0, trauma - rdt * (cine ? 0.45 : 1.05));
  } else renderer.render(scene, camera);

  needle.setAttribute('transform', `rotate(${(controls.getAzimuthalAngle() * 180 / Math.PI).toFixed(1)} 15 15)`);
  requestAnimationFrame(frame);
}

// ============ boot
resize();
TOOLS.quake.r = Math.max(420, 0.9 * FB.diag);
homeView(true);
measure();
if (document.fonts) document.fonts.ready.then(measure);
syncButtons();
window.__cau = {
  strikeAt(name, t) {
    const b = B.find((x) => x.n === name); if (!b) return false;
    setTool(t);
    const tgt = new THREE.Vector3(b.cx, b.g + b.h * 0.4, b.cz);
    const v = tgt.clone().project(camera), r = renderer.domElement.getBoundingClientRect();
    strike(pickAt(r.left + (v.x + 1) / 2 * r.width, r.top + (1 - v.y) / 2 * r.height));
    return true;
  },
  tick(sec) { for (let i = 0; i < Math.round(sec * 60); i++) simulate(1 / 60, performance.now()); },
  laserPath(pts) { fireLaser(pts.map(([x, z]) => new THREE.Vector3(x, groundY(x, z), z))); },
  meteorAt(x, z) { launchMeteor(new THREE.Vector3(x, groundY(x, z), z)); },
  setBat(k) { setBatSize(k); },
  async renderSfx(name, arg, sec = 1.6) {

    out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);

  deep: () => ({ x: deepX, z: deepZ, d: maxDig, gy: groundY(deepX, deepZ), score, style, rank: rankIdx, layer: layerMax, center: centerDone }),
  freeze(v) { frozen = !!v; },

  runStats: () => runStats(),
  stats: () => ({ dyn: dyn.size, world: world.size, history: history.length, bombs: bombs.length, frames, fx: fx.length, pixelRatio, trees: TREES.length, coarse: COARSE, phone: PHONE }),
};
window.__cauReady = true;
$('loading').hidden = true;
requestAnimationFrame(frame);
